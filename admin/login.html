<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" href="../assets/images/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Administration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body login-page">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:20px;">
      <img src="../assets/images/logo.png" alt="Logo" loading="lazy" decoding="async" style="width:70px;height:70px;object-fit:contain;margin:0 auto 10px;display:block;">
      <h2>Administration</h2>
      <p style="color:var(--text-light);font-size:0.9rem;">Chronique de James Mukeshaba</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label>Identifiant</label>
        <input type="text" id="username" class="form-input" placeholder="Nom d'utilisateur" required>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" class="form-input" placeholder="Mot de passe" required>
      </div>
      <div class="form-group" id="totp-wrap" style="display:none;">
        <label>Code de sécurité (2FA)</label>
        <input type="text" id="totp-code" class="form-input" placeholder="6 chiffres" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <small style="color:var(--text-light);">Entrez le code de votre application d'authentification.</small>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem;">Se connecter</button>
    </form>

  </div>
  <script>
    window.addEventListener('load', function () {
      var t = document.getElementById('totp-code');
      if (t) t.addEventListener('input', function () { t.value = t.value.replace(/\D/g, ''); });
    });
  </script>
  <script src="../js/main.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
